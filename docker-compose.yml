version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: medisphere-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: medisphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Redis Caching Engine
  redis:
    image: redis:7-alpine
    container_name: medisphere-redis
    restart: always
    ports:
      - "6379:6379"

  # 3. MinIO Object Storage (S3 Mock)
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: medisphere-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # 4. FastAPI Backend Monolith
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisphere-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/medisphere
      - SECRET_KEY=super-secret-key-change-in-production-guideline
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=medisphere-documents
    depends_on:
      - db
      - redis
      - minio

  # 5. React Frontend Page Shell
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medisphere-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
