name: MediSphere AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Backend Testing Job
  backend-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Schema and Safety Database Verification
      run: |
        python backend/app/seed.py
        # Run local diagnostic test suites
        # python scratch/test_db_and_safety.py

  # 2. Frontend Build Job
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        cd frontend
        npm install

    - name: Verify TypeScript compilation
      run: |
        cd frontend
        # Run compiler build checks
        # npm run build
